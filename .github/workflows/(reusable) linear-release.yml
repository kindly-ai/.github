name: "(Reusable) GitHub Release to Linear"

on:
  workflow_call:
    secrets:
      linear-api-key:
        description: 'The Linear API key.'
        required: true

jobs:
  update-linear-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: previous_release
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            });

            if (releases.data.length < 2) {
              core.info('No previous release found.');
              return;
            }
            const previousRelease = releases.data[1];
            core.setOutput('tag_name', previousRelease.tag_name);

      - name: Get PR numbers in release
        id: pr_numbers
        if: steps.previous_release.outputs.tag_name
        run: |
          prev_tag=${{ steps.previous_release.outputs.tag_name }}
          current_tag=${{ github.ref_name }}
          pr_numbers_json=$(git log $prev_tag..$current_tag --pretty=%s | grep -oE '\(#[0-9]+\)|^Merge pull request #[0-9]+' | grep -oE '[0-9]+' | jq -scR 'split("\n") | map(select(length > 0)) | map(tonumber) | unique')
          echo "numbers=${pr_numbers_json}" >> $GITHUB_OUTPUT

      - name: Label released PRs
        if: steps.pr_numbers.outputs.numbers && steps.pr_numbers.outputs.numbers != '[]'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const prNumbers = ${{ steps.pr_numbers.outputs.numbers }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = '🚀 released';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner, repo, name: labelName, color: '6f42c1', description: 'Included in a production release' });
                core.info(`Created "${labelName}" label.`);
              } else {
                throw e;
              }
            }

            const results = await Promise.allSettled(
              prNumbers.map(pr =>
                github.rest.issues.addLabels({ owner, repo, issue_number: pr, labels: [labelName] })
              )
            );

            results.forEach((r, i) => {
              if (r.status === 'fulfilled') core.info(`Labeled PR #${prNumbers[i]}`);
              else core.warning(`Failed to label PR #${prNumbers[i]}: ${r.reason.message}`);
            });

      - name: Move released Linear tickets and comment in synced Slack threads
        if: steps.pr_numbers.outputs.numbers && steps.pr_numbers.outputs.numbers != '[]'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumbers = ${{ steps.pr_numbers.outputs.numbers }};
            const linearApiKey = '${{ secrets.linear-api-key }}';

            const TICKET_PATTERN = /(CAN|ENGN|INTEL|ATLAS)-\d+/g;
            const MERGED_STATE_IDS = new Set([
              'b00c5e2d-f7b0-4134-9181-35169a0ce16b', // "🔀 Merged" state ID from Team Canvas
              '1c81a071-5649-4722-820d-6fb1aa5a05b6', // "🔀 Merged" state ID from Team Intel
              '51f1e757-1321-49fd-822b-8cb0e0703cec', // "🔀 Merged" state ID from Team Engine
              'ca456b3c-223a-4266-b043-3386ea7d89ce', // "🔀 Merged" state ID from Team Atlas
            ]);
            // Teams listed here have released issues moved out of Merged; the rest only get the comment.
            const RELEASED_STATE_BY_MERGED_STATE = {
              '1c81a071-5649-4722-820d-6fb1aa5a05b6': '2f1f661a-ade3-4acd-b635-1f924a06e658', // Team Intel "Released / Done"
            };

            async function linearQuery(query, variables) {
              const response = await fetch('https://api.linear.app/graphql', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': linearApiKey,
                },
                body: JSON.stringify({ query, variables }),
              });
              const result = await response.json();
              if (result.errors) {
                throw new Error(`Linear API Error: ${JSON.stringify(result.errors)}`);
              }
              return result.data;
            }

            const normalizeUrl = url => url.replace(/[?#].*$/, '').replace(/\/+$/, '').toLowerCase();

            const ticketIdentifiers = new Set();
            const releasedPrUrls = new Set();

            const prResults = await Promise.allSettled(
              prNumbers.map(prNumber =>
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })
              )
            );

            prResults.forEach((result, index) => {
              if (result.status === 'fulfilled') {
                const pr = result.value.data;
                releasedPrUrls.add(normalizeUrl(pr.html_url));
                const content = `${pr.title} ${pr.body || ''} ${pr.head.ref}`;
                for (const match of content.matchAll(TICKET_PATTERN)) {
                  ticketIdentifiers.add(match[0]);
                }
              } else {
                core.warning(`Could not fetch PR #${prNumbers[index]}. It might have been deleted. Error: ${result.reason.message}`);
              }
            });

            if (ticketIdentifiers.size === 0) {
              core.info('No Linear tickets found in release PRs.');
              return;
            }

            core.info(`Found tickets: ${Array.from(ticketIdentifiers).join(', ')}`);

            // One lookup per ticket: a state-filtered issues query is paginated and silently stops at its first page.
            const getIssueQuery = `
              query GetIssue($id: String!) {
                issue(id: $id) {
                  identifier
                  state { id }
                  attachments(first: 100) { nodes { url } }
                }
              }`;

            const mergedIssues = [];
            for (const identifier of ticketIdentifiers) {
              try {
                const { issue } = await linearQuery(getIssueQuery, { id: identifier });
                // Linear can resolve an unknown key to a different issue, so only trust an exact identifier match.
                if (!issue || issue.identifier !== identifier) {
                  core.info(`skipped ${identifier} (no such issue)`);
                } else if (!MERGED_STATE_IDS.has(issue.state.id)) {
                  core.info(`skipped ${identifier} (not in Merged)`);
                } else {
                  const bound = issue.attachments.nodes.some(a => releasedPrUrls.has(normalizeUrl(a.url)));
                  mergedIssues.push({ identifier, stateId: issue.state.id, bound });
                }
              } catch (e) {
                core.info(`skipped ${identifier} (lookup failed: ${e.message})`);
              }
            }

            if (mergedIssues.length === 0) {
              core.info('No tickets in "Merged" state to move or comment on.');
              return;
            }

            const updateIssueMutation = `
              mutation MoveIssue($id: String!, $stateId: String!) {
                issueUpdate(id: $id, input: { stateId: $stateId }) {
                  success
                }
              }`;

            const failedMoves = [];
            for (const { identifier, stateId, bound } of mergedIssues) {
              const releasedStateId = RELEASED_STATE_BY_MERGED_STATE[stateId];
              if (!releasedStateId) {
                continue;
              }
              // A key merely mentioned in a PR body is not proof the work shipped; the PR must be attached to the issue.
              if (!bound) {
                core.info(`skipped ${identifier} (no attachment for a PR in this release)`);
                continue;
              }
              try {
                const { issueUpdate } = await linearQuery(updateIssueMutation, { id: identifier, stateId: releasedStateId });
                if (!issueUpdate.success) {
                  throw new Error('issueUpdate returned success: false');
                }
                core.info(`moved ${identifier}`);
              } catch (e) {
                failedMoves.push(identifier);
                core.warning(`failed ${identifier} (${e.message})`);
              }
            }

            const commentMutation = `
              mutation CreateComment($issueId: String!, $body: String!) {
                commentCreate(input: { issueId: $issueId, body: $body, createOnSyncedSlackThread: true }) {
                  success
                }
              }`;

            await Promise.allSettled(
              mergedIssues.map(async ({ identifier }) => {
                try {
                  await linearQuery(commentMutation, {
                    issueId: identifier,
                    body: "Hey team, this task has been now released to the public 🚀",
                  });
                  core.info(`Successfully commented on synced Slack thread for ticket ${identifier}.`);
                } catch (e) {
                  // Linear API throws if no synced thread exists when createOnSyncedSlackThread is true
                  core.info(`Skipped commenting on ${identifier} (likely no synced Slack thread): ${e.message}`);
                }
              })
            );

            if (failedMoves.length > 0) {
              core.setFailed(`Could not move ${failedMoves.join(', ')} to their released state.`);
            }
